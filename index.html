<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Projectile Aiming</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main class="stage">
      <canvas id="game" aria-label="Arena permainan"></canvas>

      <section class="overlay" data-overlay hidden>
        <div class="panel">
          <h1 data-overlay-title></h1>
          <div data-overlay-body></div>
          <button type="button" data-overlay-action></button>
        </div>
      </section>

      <p class="rotate-hint">Putar perangkat ke mode landscape untuk tampilan terbaik.</p>
    </main>
  </body>
</html>
